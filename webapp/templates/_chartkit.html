{# Общий набор помощников для графиков (Lightweight Charts v4.1.3).
   Подключать ПОСЛЕ /static/lightweight-charts.js и ДО скрипта страницы.
   Всё спрятано в TVK — глобальных имён страницы не занимает. #}
<script>
window.TVK = (function () {
  "use strict";

  /* палитра TradingView — та же, что в app.css */
  var P = { bg:"#131722", grid:"#1e222d", line:"#2a2e39", ink:"#d1d4dc",
    muted:"#787b86", muted2:"#5d6068", up:"#26a69a", down:"#ef5350",
    accent:"#2962ff", warn:"#ff9f0a", liq:"#ff5370", info:"#7aa2f7",
    violet:"#bb9af7", cross:"#4c525e", crossBg:"#363a45",
    /* нейтральный серый для сделок «в ноль» — заметно светлее muted2,
       которым страницы гасят обучающий период, чтобы два серых не слились */
    flat:"#8f939e" };

  var byId = function (x) {
    return (typeof x === "string") ? document.getElementById(x) : x;
  };
  var isNum = function (v) { return typeof v === "number" && isFinite(v); };

  /* ---------- время и форматирование ---------- */
  function ts(v) {                       // и миллисекунды, и секунды -> секунды
    var t = Number(v);
    if (!isFinite(t) || t <= 0) return null;
    return Math.floor(t > 1e11 ? t / 1000 : t);
  }
  function fmtN(v, d) {                   // «сколько нужно» знаков, но не больше d
    if (!isFinite(Number(v))) return "–";
    return Number(v).toLocaleString("ru",
      { minimumFractionDigits: 0, maximumFractionDigits: d === undefined ? 2 : d });
  }
  function fmtFix(v, d) {                 // ровно d знаков (для денег)
    if (!isFinite(Number(v))) return "–";
    return Number(v).toFixed(d === undefined ? 2 : d);
  }
  function fmtUsd(v, d) {
    if (!isFinite(Number(v))) return "–";
    var a = Math.abs(v);
    return "$" + fmtFix(v, d === undefined ? (a >= 1000 ? 0 : 2) : d);
  }
  function fmtPct(v, d) {
    if (!isFinite(Number(v))) return "–";
    return (v >= 0 ? "+" : "") + Number(v).toFixed(d === undefined ? 1 : d) + "%";
  }
  function fmtDate(t) {
    t = ts(t);
    return t === null ? "–" : new Date(t * 1000).toLocaleDateString("ru");
  }
  function fmtDT(t) {
    t = ts(t);
    return t === null ? "–" : new Date(t * 1000).toLocaleString("ru",
      { day:"2-digit", month:"2-digit", year:"2-digit",
        hour:"2-digit", minute:"2-digit" });
  }
  function cls(v) { return !isFinite(Number(v)) ? "" : (v > 0 ? "pos" : v < 0 ? "neg" : ""); }
  function esc(s) {
    return String(s === null || s === undefined ? "" : s)
      .replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;")
      .replace(/"/g, "&quot;");
  }

  /* ---------- ДАННЫЕ: схлопывание дубликатов времени ----------
     Lightweight Charts падает на двух точках с одинаковым ts и на
     несортированном ряде — поэтому ВСЕ данные проходят через points()/bars(). */
  function points(raw) {
    var m = new Map(), i, p, t, v;
    raw = raw || [];
    for (i = 0; i < raw.length; i++) {
      p = raw[i];
      if (Array.isArray(p)) { t = p[0]; v = p[1]; }
      else if (p && typeof p === "object") {
        t = (p.time !== undefined) ? p.time : p.ts;
        v = (p.value !== undefined) ? p.value : p.pct;
      } else continue;
      t = ts(t); v = Number(v);
      if (t === null || !isFinite(v)) continue;
      m.set(t, v);                        // дубликат ts -> берём последнее
    }
    return Array.from(m.keys()).sort(function (a, b) { return a - b; })
      .map(function (t) { return { time: t, value: m.get(t) }; });
  }
  function histPoints(raw, upC, downC) {
    return points(raw).map(function (p) {
      p.color = p.value >= 0 ? (upC || P.up) : (downC || P.down);
      return p;
    });
  }
  function bars(raw) {
    var m = new Map(), i, c, t, o, h, l, cl2;
    raw = raw || [];
    for (i = 0; i < raw.length; i++) {
      c = raw[i];
      if (!c) continue;
      if (Array.isArray(c)) { t = c[0]; o = c[1]; h = c[2]; l = c[3]; cl2 = c[4]; }
      else { t = c.time; o = c.open; h = c.high; l = c.low; cl2 = c.close; }
      t = ts(t);
      if (t === null || !isFinite(Number(o)) || !isFinite(Number(cl2))) continue;
      m.set(t, { time: t, open: +o, high: +h, low: +l, close: +cl2 });
    }
    return Array.from(m.keys()).sort(function (a, b) { return a - b; })
      .map(function (t) { return m.get(t); });
  }

  /* ---------- создание графиков ---------- */
  function merge(a, b) {                  // слияние на два уровня вглубь
    var out = {}, k;
    for (k in a) out[k] = a[k];
    for (k in (b || {})) {
      if (b[k] && typeof b[k] === "object" && !Array.isArray(b[k]) &&
          out[k] && typeof out[k] === "object" && !Array.isArray(out[k]))
        out[k] = merge(out[k], b[k]);
      else out[k] = b[k];
    }
    return out;
  }
  function opts(h, extra) {
    return merge({
      layout: { background: { color: P.bg }, textColor: P.muted,
        fontFamily: getComputedStyle(document.body).fontFamily },
      grid: { vertLines: { color: P.grid }, horzLines: { color: P.grid } },
      /* minBarSpacing по умолчанию 0.5px — при длинной истории «весь период»
         тогда физически не влезает и показывается только хвост. Уменьшаем. */
      timeScale: { timeVisible: true, secondsVisible: false,
        borderColor: P.line, rightOffset: 2, minBarSpacing: 0.02 },
      rightPriceScale: { borderColor: P.line, minimumWidth: 78,
        scaleMargins: { top: .1, bottom: .1 } },
      /* крестик с плашками на ОБЕИХ шкалах */
      crosshair: { mode: 0,
        vertLine: { color: P.cross, width: 1, style: 3, labelVisible: true,
          labelBackgroundColor: P.crossBg },
        horzLine: { color: P.cross, width: 1, style: 3, labelVisible: true,
          labelBackgroundColor: P.crossBg } },
      height: h, autoSize: true,
    }, extra);
  }
  function create(el, h, extra) {
    return LightweightCharts.createChart(byId(el), opts(h, extra));
  }
  function mini(el, h, extra) {           // подпанель без своей шкалы времени
    return create(el, h || 190, merge({
      timeScale: { timeVisible: false, borderColor: P.line },
      rightPriceScale: { scaleMargins: { top: .14, bottom: .1 } },
    }, extra));
  }

  /* ---------- синхронизация двух графиков ----------
     Флаг снимается в СЛЕДУЮЩЕМ кадре, а не сразу: setVisibleLogicalRange у
     второго графика вызывает его собственный колбэк асинхронно, и при
     синхронном сбросе флага графики начинали бесконечно поправлять друг
     друга — масштаб «дёргался» и уезжал при каждом зуме. */
  var syncing = 0;
  function releaseSync() {
    if (window.requestAnimationFrame)
      requestAnimationFrame(function () { syncing = 0; });
    else setTimeout(function () { syncing = 0; }, 0);
  }
  function link(a, b) {
    a.timeScale().subscribeVisibleLogicalRangeChange(function (r) {
      if (syncing || !r) return;
      syncing = 1;
      try { b.timeScale().setVisibleLogicalRange(r); } catch (e) {}
      releaseSync();
    });
  }
  function sync(a, b) { link(a, b); link(b, a); }
  var crossGuard = false;
  function linkCross(src, dst, dstSeries) {
    src.subscribeCrosshairMove(function (p) {
      if (crossGuard) return;
      crossGuard = true;
      try {
        if (!p || !p.time) dst.clearCrosshairPosition();
        else dst.setCrosshairPosition(0, p.time, dstSeries);
      } catch (e) {}
      crossGuard = false;
    });
  }
  function syncCross(a, b, aSeries, bSeries) {
    linkCross(a, b, bSeries); linkCross(b, a, aSeries);
  }

  /* ---------- пилюли масштаба: 1М / 3М / 6М / 1Г / Всё + сброс ---------- */
  var RANGES = [ { d: 30, lab: "1М" }, { d: 91, lab: "3М" },
                 { d: 182, lab: "6М" }, { d: 365, lab: "1Г" },
                 { d: 0, lab: "Всё" } ];
  function ranges(el, charts, boundsFn, o) {
    el = byId(el);
    if (!el) return { refresh: function () {}, set: function () {} };
    charts = Array.isArray(charts) ? charts : [charts];
    o = o || {};
    var def = o.def === undefined ? 0 : o.def;
    el.classList.add("pills");
    el.innerHTML = RANGES.map(function (r) {
      return '<button type="button" data-d="' + r.d + '"'
        + (r.d === def ? ' class="on"' : '') + ">" + r.lab + "</button>";
    }).join("") + '<button type="button" class="pill-ic" data-d="fit"'
      + ' title="сбросить масштаб">⤢</button>';

    var selfApply = 0;               // 1, пока масштаб меняем МЫ, а не мышь
    function applyNow(d) {
      var b = boundsFn() || [], i, from;
      if (!isNum(b[0]) || !isNum(b[1])) return;
      selfApply = 1;
      for (i = 0; i < charts.length; i++) {
        try {
          if (!d) charts[i].timeScale().fitContent();
          else {
            from = Math.max(b[0], b[1] - d * 86400);
            charts[i].timeScale().setVisibleRange({ from: from, to: b[1] });
          }
        } catch (e) {}
      }
      if (window.requestAnimationFrame)
        requestAnimationFrame(function () { selfApply = 0; });
      else setTimeout(function () { selfApply = 0; }, 0);
    }
    /* Повтор после раскладки: если ширину графика браузер узнал позже,
       первый fitContent оставил бы виден только хвост истории.
       НО повтор обязан отменяться, если пользователь тем временем сам
       поменял масштаб — иначе отложенный вызов через 160 мс перетирал
       ручной зум, и график «ломался» прямо под руками. */
    var applyToken = 0;
    function apply(d) {
      var my = ++applyToken;
      applyNow(d);
      var again = function () { if (my === applyToken) applyNow(d); };
      if (window.requestAnimationFrame) requestAnimationFrame(again);
      setTimeout(again, 160);
    }
    /* РУЧНОЕ изменение масштаба отменяет отложенные повторы (свои
       изменения пропускаем по флагу selfApply, иначе повтор отменялся бы
       нашим же вызовом и «догон раскладки» никогда не срабатывал) */
    for (var ci = 0; ci < charts.length; ci++) {
      (function (ch) {
        try {
          ch.timeScale().subscribeVisibleLogicalRangeChange(function () {
            if (!selfApply) applyToken++;
          });
        } catch (e) {}
      })(charts[ci]);
    }
    function mark(d) {
      var bs = el.querySelectorAll("button[data-d]"), i;
      for (i = 0; i < bs.length; i++)
        bs[i].classList.toggle("on", bs[i].dataset.d === String(d));
    }
    el.addEventListener("click", function (e) {
      var b = e.target.closest("button");
      if (!b) return;
      if (b.dataset.d === "fit") { apply(0); mark(0); if (o.onFit) o.onFit(); return; }
      var d = Number(b.dataset.d);
      apply(d); mark(d);
    });
    var api = {
      set: function (d) { apply(d); mark(d); },
      /* окна длиннее истории гасим, чтобы не обманывать глаз */
      refresh: function () {
        var b = boundsFn() || [], span, bs, i, d;
        if (!isNum(b[0]) || !isNum(b[1])) return;
        span = (b[1] - b[0]) / 86400;
        bs = el.querySelectorAll("button[data-d]");
        for (i = 0; i < bs.length; i++) {
          d = Number(bs[i].dataset.d);
          if (d) bs[i].classList.toggle("dis", d > span * 1.02);
        }
        api.set(def);
      },
    };
    return api;
  }

  /* «весь период» с повтором после раскладки (см. apply выше) */
  function fit(chart) {
    var go = function () { try { chart.timeScale().fitContent(); } catch (e) {} };
    go();
    if (window.requestAnimationFrame) requestAnimationFrame(go);
    setTimeout(go, 160);
  }

  /* ---------- легенда-оверлей: значения ПОД КУРСОРОМ ---------- */
  function candleLegend(chart, series, el, o) {
    el = byId(el); o = o || {};
    var dig = o.digits === undefined ? 1 : o.digits;
    var idle = o.idle || "наведи курсор на свечу";
    function nf(v) { return isNum(v) ? fmtN(v, dig) : "–"; }
    chart.subscribeCrosshairMove(function (p) {
      var b = (p && p.seriesData) ? p.seriesData.get(series) : null;
      if (!b) { el.innerHTML = "<span>" + esc(idle) + "</span>"; return; }
      var up = b.close >= b.open;
      var ch = b.open ? (b.close / b.open - 1) * 100 : 0;
      el.innerHTML = "<span>" + fmtDT(p.time) + "</span>  <span>O</span> " + nf(b.open)
        + " <span>H</span> " + nf(b.high) + " <span>L</span> " + nf(b.low)
        + ' <span>C</span> <b style="color:' + (up ? P.up : P.down) + '">'
        + nf(b.close) + '</b> <b style="color:' + (up ? P.up : P.down) + '">'
        + fmtPct(ch, 2) + "</b>";
    });
  }
  /* items: [{series, label, color, fmt}] */
  function lineLegend(chart, el, items, o) {
    el = byId(el); o = o || {};
    function paint(vals, when) {
      if (!vals) {                       // покоя — только подсказка, без «–»
        el.innerHTML = "<span>" + esc(o.idle || "наведи курсор") + "</span>";
        return;
      }
      var html = items.map(function (it, i) {
        var v = vals[i];
        if (v === null || v === undefined) return "";
        return '<span class="ll"><i style="background:' + it.color + '"></i>'
          + esc(it.label) + " <b>" + (it.fmt ? it.fmt(v) : fmtN(v, 2))
          + "</b></span>";
      }).join("");
      el.innerHTML = (when ? "<span>" + esc(when) + "</span> " : "") + html;
    }
    chart.subscribeCrosshairMove(function (p) {
      if (!p || !p.time || !p.seriesData) { paint(null, o.idle || ""); return; }
      paint(items.map(function (it) {
        var d = p.seriesData.get(it.series);
        return d ? (d.value !== undefined ? d.value : d.close) : null;
      }), fmtDate(p.time));
    });
    paint(null, o.idle || "");
    return { paint: paint };
  }

  /* ---------- ГРАФИК ПРИБЫЛИ ПО МЕСЯЦАМ ----------
     months: [{ts,label,pct,usd,n}] — данные /api/monthly/<key>. */
  function monthBars(host, res, o) {
    host = byId(host);
    if (!host) return null;
    o = o || {};
    var months = (res && res.months) ? res.months : (Array.isArray(res) ? res : []);
    if (!months.length) {
      host.innerHTML = '<div class="ph">Помесячных данных пока нет.</div>';
      return null;
    }
    var vals = months.map(function (m) { return isNum(+m.pct) ? +m.pct : 0; });
    var maxP = Math.max.apply(null, vals.concat([0]));
    var maxN = Math.min.apply(null, vals.concat([0]));
    var ph = (maxP <= 0) ? 0.12 : (maxN >= 0 ? 0.88 : maxP / (maxP - maxN));
    ph = Math.min(0.88, Math.max(0.12, ph));
    var hp = maxP > 0 ? maxP : 1, hn = maxN < 0 ? -maxN : 1;
    var n = months.length;

    var cols = months.map(function (m, i) {
      var v = vals[i];
      var up = v > 0 ? (v / hp * 100) : 0;
      var dn = v < 0 ? (-v / hn * 100) : 0;
      var col = v > 0 ? P.up : v < 0 ? P.down : P.muted2;
      var tip = m.label + " · " + fmtPct(v, 1)
        + (isNum(+m.usd) ? " · " + (m.usd >= 0 ? "+" : "") + fmtN(m.usd, 2) + "$" : "")
        + (isNum(+m.n) ? " · сделок " + m.n : "");
      return '<div class="mcol" data-i="' + i + '" title="' + esc(tip) + '">'
        + '<div class="mpos"><i style="height:' + up.toFixed(2) + "%;background:"
        + col + '"></i></div>'
        + '<div class="mneg"><i style="height:' + dn.toFixed(2) + "%;background:"
        + col + '"></i></div></div>';
    }).join("");

    /* подписи: при коротком ряде — все месяцы, при длинном — только январи */
    var labs = months.map(function (m, i) {
      var lab = String(m.label || "");
      var mo = lab.slice(5), yr = lab.slice(2, 4);
      var show = (n <= 15) ? (mo + "." + yr)
        : ((mo === "01" || i === 0) ? lab.slice(0, 4) : "");
      return "<div>" + esc(show) + "</div>";
    }).join("");

    var s = res && res.summary ? res.summary : {};
    var sum = "";
    if (isNum(+s.pos) && isNum(+s.total))
      sum += '<span class="badge ' + (s.pos * 2 >= s.total ? "badge--on" : "badge--off")
        + '">месяцев в плюсе ' + s.pos + " из " + s.total + "</span>";
    if (s.best) sum += '<span>лучший <b class="pos">' + fmtPct(s.best.pct, 1)
      + "</b> <span class=\"muted-2\">" + esc(s.best.label) + "</span></span>";
    if (s.worst) sum += '<span>худший <b class="neg">' + fmtPct(s.worst.pct, 1)
      + "</b> <span class=\"muted-2\">" + esc(s.worst.label) + "</span></span>";
    if (isNum(+s.avg)) sum += '<span>средний <b class="' + cls(s.avg) + '">'
      + fmtPct(s.avg, 1) + "</b></span>";
    if (isNum(+s.flat) && s.flat) sum += '<span class="muted-2">без сделок '
      + s.flat + "</span>";

    host.innerHTML =
      '<div class="mhead"><span class="mcap">' + esc(o.caption || "доход за месяц")
      + '</span><span class="mval muted-2">наведи курсор на столбец</span></div>'
      + '<div class="mbars" style="--ph:' + ph.toFixed(3) + '">'
      + '<span class="mzero"></span>' + cols + "</div>"
      + '<div class="mlabels">' + labs + "</div>"
      + '<div class="msum">' + sum + "</div>";

    var bars2 = host.querySelector(".mbars");
    var capEl = host.querySelector(".mcap"), valEl = host.querySelector(".mval");
    bars2.addEventListener("mousemove", function (e) {
      var c = e.target.closest(".mcol");
      if (!c) return;
      var m = months[+c.dataset.i], v = vals[+c.dataset.i];
      capEl.textContent = m.label;
      valEl.className = "mval " + cls(v);
      valEl.innerHTML = "<b>" + fmtPct(v, 2) + "</b>"
        + (isNum(+m.usd) ? ' <span class="muted-2">' + (m.usd >= 0 ? "+" : "")
            + fmtN(m.usd, 2) + "$</span>" : "")
        + (isNum(+m.n) ? ' <span class="muted-2">· сделок ' + m.n + "</span>" : "");
    });
    bars2.addEventListener("mouseleave", function () {
      capEl.textContent = o.caption || "доход за месяц";
      valEl.className = "mval muted-2";
      valEl.textContent = "наведи курсор на столбец";
    });
    return { months: months, summary: s };
  }

  /* загрузка /api/monthly/<key> и отрисовка; onEmpty — если данных нет */
  function monthChart(host, key, o) {
    o = o || {};
    return fetch("/api/monthly/" + key).then(function (r) { return r.json(); })
      .then(function (d) {
        if (!d || !d.available || !d.months || !d.months.length) {
          if (o.onEmpty) o.onEmpty();
          else { var h = byId(host); if (h) h.innerHTML =
            '<div class="ph">Помесячных данных пока нет.</div>'; }
          return null;
        }
        if (o.onData) o.onData(d);
        return monthBars(host, d, o);
      })
      .catch(function (e) {
        if (o.onEmpty) o.onEmpty(e);
        return null;
      });
  }

  /* ================= ИСХОД СДЕЛКИ: прибыль / убыток / «В НОЛЬ» =========
     Перенос стопа в безубыток закрывает цикл на +0.001$. Формально это
     «победа», фактически — ноль. Пока классов исхода два, график ВРЁТ:
     89% циклов SOL нарисованы зелёными с подписью «+0.001$», а винрейт
     ботов раздут до 95-98% (честный — 78-83%). Поэтому классов ТРИ, и
     третий рисуется нейтральным серым с подписью «≈0».

     ПОРОГ. «В ноль» = |PnL| < 1% маржи цикла = $0.05 при марже $5 — та же
     константа, что в bots_honest.TINY_USD и signal_builder.TINY_USD (это
     примерно половина издержек одного цикла, то есть шум, а не результат).
     Если у сделки уже есть поле tiny (боты: build_analytics кладёт его
     рядом с be), верим ему — порог нужен только там, где поля нет.
     Сделки БЕЗ pnl (страницы сигналов передают только R) остаются
     двухклассовыми осознанно: R нормирован на риск, и |R| < 0.01 значит
     не «ноль денег», а другое. Измерено: у сигнальных сетапов доля
     «в ноль» 0.0-2.9%, артефакта там нет. */
  var TINY = { usd: 0.05, frac: 0.01, margin: 5,
    lab: "≈0", name: "в ноль (безубыток)",
    note: "закрыто в безубыток (перенос стопа), результат ≈ 0" };

  function tinyThr(o) {                    // порог из данных, если он там есть
    o = o || {};
    var v = Number(o.tinyUsd !== undefined ? o.tinyUsd : o.tiny_thr);
    return (isFinite(v) && v > 0) ? v : TINY.usd;
  }
  function outVal(t) {                     // «на сколько закрылись» (R или $)
    if (!t) return NaN;
    if (t.r !== undefined && t.r !== null && isFinite(Number(t.r)))
      return Number(t.r);
    return Number(t.pnl !== undefined ? t.pnl : t.pnl_usd);
  }
  function isTiny(t, thr) {
    if (!t) return false;
    if (t.tiny !== undefined && t.tiny !== null) return !!t.tiny;  // флаг данных
    var p = Number(t.pnl !== undefined ? t.pnl : t.pnl_usd);
    if (!isFinite(p)) return false;        // нет денег в сделке — не судим
    return Math.abs(p) < ((isFinite(thr) && thr > 0) ? thr : TINY.usd);
  }
  /* "win" | "loss" | "flat" — ЕДИНАЯ точка правды для цвета и подписи */
  function outcome(t, thr) {
    if (isTiny(t, thr)) return "flat";
    return outVal(t) > 0 ? "win" : "loss";
  }
  function outColor(t, o) {
    o = o || {};
    var k = outcome(t, tinyThr(o));
    return k === "flat" ? (o.flatColor || P.flat)
         : k === "win" ? (o.winColor || P.up) : (o.lossColor || P.down);
  }
  /* Подпись выхода: у «в ноль» это ВСЕГДА «≈0», а не «+0.001$» */
  function outLabel(t, o) {
    o = o || {};
    if (outcome(t, tinyThr(o)) === "flat") return TINY.lab;
    if (o.label) return o.label(t);
    var v = outVal(t);
    if (!isFinite(v)) return "";
    return (v > 0 ? "+" : "") + fmtFix(v, o.digits === undefined ? 1 : o.digits)
      + (o.unit === undefined ? "" : o.unit);
  }
  /* Легенда трёх классов — одинаковая на всех страницах проекта */
  function tradeLegend(o) {
    o = o || {};
    var it = function (c, s) {
      return '<span><i style="background:' + c + '"></i>' + s + "</span>";
    };
    return it(o.winColor || P.up, esc(o.winText || "прибыльная сделка"))
      + it(o.lossColor || P.down, esc(o.lossText || "убыточная"))
      + it(o.flatColor || P.flat, esc(o.flatText
          || ("в ноль «≈0»: |итог| < " + fmtUsd(tinyThr(o), 2)
              + " (1% маржи цикла) — перенос стопа в безубыток, а не победа")))
      + (o.extra || "");
  }

  /* ---------- маркеры сделок (вход-стрелка + выход-кружок) ----------
     Одна разметка на все страницы: цвет выхода и его подпись берутся из
     outcome(), поэтому «в ноль» нигде не сможет притвориться прибылью.
     o: {snap(ts,t), dim(t)->bool (гасить, напр. обучающий период),
         skip(t)->bool, liq(t)->bool, tinyUsd, unit, digits, label(t), size} */
  function tradeMarkers(trades, o) {
    o = o || {};
    var thr = tinyThr(o);
    var snapf = o.snap || function (t) { return ts(t); };
    var out = [];
    (trades || []).forEach(function (t) {
      if (o.skip && o.skip(t)) return;
      var dim = o.dim ? !!o.dim(t) : false;
      var long = (t.side === "L" || t.side === "long" || t.side === "buy");
      var te = snapf(t.entry_ts, t), tx = snapf(t.exit_ts, t);
      if (te !== null && te !== undefined && isFinite(te))
        out.push({ time: te, position: long ? "belowBar" : "aboveBar",
          color: dim ? P.muted2 : (long ? P.up : P.down),
          shape: long ? "arrowUp" : "arrowDown", text: "" });
      if (tx !== null && tx !== undefined && isFinite(tx))
        out.push({ time: tx, position: long ? "aboveBar" : "belowBar",
          color: dim ? P.muted2 : outColor(t, o),
          shape: (o.liq && o.liq(t)) ? "square" : "circle",
          size: o.size === undefined ? 0.8 : o.size,
          text: dim ? "" : outLabel(t, o) });
    });
    out.sort(function (a, b) { return a.time - b.time; });
    return out;
  }

  /* ---------- ридаут «что за сделка под курсором» ----------
     Библиотека не умеет ховер по маркеру, поэтому ищем сделку, ВНУТРИ
     которой лежит время курсора (бинарный поиск по входам). Для «в ноль»
     пишем прямым текстом, что это перенос стопа, а не победа. */
  function tradeReadout(chart, trades, el, o) {
    el = byId(el); o = o || {};
    if (!el) return { paint: function () {} };
    var thr = tinyThr(o), idle = o.idle || "";
    var list = (trades || []).filter(function (t) {
        return ts(t.entry_ts) !== null && ts(t.exit_ts) !== null;
      }).sort(function (a, b) { return ts(a.entry_ts) - ts(b.entry_ts); });
    var starts = list.map(function (t) { return ts(t.entry_ts); });
    var pad = Math.max(0, Number(o.bar) || 0);
    function find(tm) {
      var lo = 0, hi = starts.length - 1, best = -1, m, i;
      while (lo <= hi) {
        m = (lo + hi) >> 1;
        if (starts[m] <= tm) { best = m; lo = m + 1; } else hi = m - 1;
      }
      /* сделки могут перекрываться (сетка/усреднение) — назад смотрим
         ограниченно, иначе на 4000 циклов это заметная работа на каждый
         кадр движения мыши */
      for (i = best; i >= 0 && i > best - 60; i--)
        if (ts(list[i].exit_ts) + pad >= tm) return list[i];
      return null;
    }
    function paint(t) {
      if (!t) { el.innerHTML = idle ? "<span>" + esc(idle) + "</span>" : ""; return; }
      var k = outcome(t, thr), col = outColor(t, o);
      var side = (t.side === "L" || t.side === "long" || t.side === "buy")
        ? "лонг" : "шорт";
      el.innerHTML = '<span class="ll"><i style="background:' + col + '"></i>'
        + esc(side) + " " + esc(fmtDT(t.entry_ts)) + " → " + esc(fmtDT(t.exit_ts))
        + "</span> <b style=\"color:" + col + '">' + esc(outLabel(t, o)) + "</b> "
        + (k === "flat"
            ? '<span style="color:' + (o.flatColor || P.flat) + '">'
              + esc(TINY.note) + "</span>"
            : '<span class="muted-2">' + esc(o.note ? o.note(t) : "") + "</span>");
    }
    chart.subscribeCrosshairMove(function (p) {
      if (!p || !p.time) { paint(null); return; }
      paint(find(ts(p.time)));
    });
    paint(null);
    return { paint: paint, find: find };
  }

  /* ---------- пунктирные линии «вход -> выход» по каждой сделке ----------
     Рисуем ВСЕ сделки ТРЕМЯ сериями (прибыльные / убыточные / «в ноль»), а
     не серией на сделку: сотня серий заметно тормозит график. Внутри серии
     сделки разделяются точкой-пропуском (whitespace), поэтому линии не
     склеиваются между собой. Время снапится на сетку баров — иначе
     библиотека не находит точку на шкале. Если у двух соседних сделок выход
     и вход попадают в один бар, второй сдвигается на бар вперёд: одинаковое
     время в серии роняет весь график.
     trades: [{entry_ts, exit_ts, entry, exit_px|avg_entry..., r|pnl, tiny}]
     Возвращает { win, loss, flat, setVisible(bool), count, counts } */
  function tradeLines(chart, trades, o) {
    o = o || {};
    var bar = Math.max(1, Number(o.bar) || 60);
    var thr = tinyThr(o);
    var snap = function (t) { return Math.floor(ts(t) / bar) * bar; };
    var mk = function (color) {
      return chart.addLineSeries({
        color: color, lineWidth: o.width || 1,
        lineStyle: LightweightCharts.LineStyle.Dashed,
        priceLineVisible: false, lastValueVisible: false,
        crosshairMarkerVisible: false, pointMarkersVisible: false,
      });
    };
    /* Каждая сделка — СВОЯ серия из двух точек. Прежний вариант складывал
       все сделки класса в одну серию с точкой-разрывом между ними, но в
       этой сборке 4.1.3 whitespace линию НЕ рвёт: библиотека соединяла
       конец одной сделки с началом следующей, и график покрывался
       диагоналями, которых в данных нет (страница ботов из-за этого ушла
       на собственный канвас-слой). Для сигналов и конструктора сделок
       десятки, так что серия-на-сделку дешева; на случай больших списков
       стоит предохранитель MAX_LINK_SERIES — дальше линии не рисуем вовсе,
       честно отдавая это в count.skipped. */
    var MAX_LINK_SERIES = 250;
    var series = [], counts = { win: 0, loss: 0, flat: 0 };
    var n = 0, skipped = 0;
    var colorOf = { win: o.winColor || P.up, loss: o.lossColor || P.down,
                    flat: o.flatColor || P.flat };
    (trades || []).slice()
      .sort(function (a, b) { return ts(a.entry_ts) - ts(b.entry_ts); })
      .forEach(function (t) {
        var e = snap(t.entry_ts), x = snap(t.exit_ts);
        var pe = Number(t.entry_px !== undefined ? t.entry_px : t.entry);
        var px = Number(t.exit_px !== undefined ? t.exit_px
                        : (t.exit !== undefined ? t.exit : t.close_px));
        if (!isFinite(e) || !isFinite(x) || !isNum(pe) || !isNum(px)) return;
        if (x < e) return;
        if (x === e) x = e + bar;                 // вход и выход в одном баре
        var k = outcome(t, thr);
        counts[k]++;
        n++;
        if (series.length >= MAX_LINK_SERIES) { skipped++; return; }
        var s = mk(colorOf[k]);
        s.setData([{ time: e, value: pe }, { time: x, value: px }]);
        series.push(s);
      });
    return {
      count: n, counts: counts, skipped: skipped,
      /* win/loss/flat оставлены для обратной совместимости вызовов вида
         LINKS.win.setData([]) — отдаём безопасные заглушки */
      win: { setData: function () {}, applyOptions: function () {} },
      loss: { setData: function () {}, applyOptions: function () {} },
      flat: { setData: function () {}, applyOptions: function () {} },
      setVisible: function (v) {
        for (var i = 0; i < series.length; i++)
          series[i].applyOptions({ visible: !!v });
      },
      remove: function () {
        for (var i = 0; i < series.length; i++)
          try { chart.removeSeries(series[i]); } catch (e) {}
        series = [];
      },
    };
  }

  return { P: P, ts: ts, isNum: isNum, esc: esc, cls: cls, tradeLines: tradeLines,
    TINY: TINY, tinyThr: tinyThr, isTiny: isTiny, outcome: outcome,
    outVal: outVal, outColor: outColor, outLabel: outLabel,
    tradeMarkers: tradeMarkers, tradeLegend: tradeLegend,
    tradeReadout: tradeReadout,
    fmtN: fmtN, fmtFix: fmtFix, fmtUsd: fmtUsd, fmtPct: fmtPct,
    fmtDate: fmtDate, fmtDT: fmtDT,
    points: points, histPoints: histPoints, bars: bars,
    opts: opts, create: create, mini: mini, merge: merge, fit: fit,
    link: link, sync: sync, linkCross: linkCross, syncCross: syncCross,
    ranges: ranges, candleLegend: candleLegend, lineLegend: lineLegend,
    monthBars: monthBars, monthChart: monthChart };
})();
</script>
